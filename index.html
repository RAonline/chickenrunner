<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChickenRunner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:hidden;

    background:#111;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    font-family:Arial,sans-serif;

}

canvas{

    border:4px solid black;

    image-rendering:pixelated;

    background:#87ceeb;

}

#loading{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#111;

    color:white;

    font-size:30px;

    z-index:999;

}

</style>
</head>

<body>

<div id="loading">
    Loading ChickenRunner...
</div>

<canvas
    id="game"
    width="1280"
    height="720">
</canvas>

<script>

// ================================
// GLOBALS
// ================================

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

ctx.imageSmoothingEnabled =
false;

// ================================
// INPUT
// ================================

const keys = {};

document.addEventListener(
    "keydown",
    (e)=>{

        keys[
            e.key.toLowerCase()
        ] = true;

    }
);

document.addEventListener(
    "keyup",
    (e)=>{

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);

// Prevent scrolling

window.addEventListener(
    "keydown",
    (e)=>{

        if(
            e.code === "Space" ||
            e.key === "ArrowUp" ||
            e.key === "ArrowDown" ||
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight"
        ){

            e.preventDefault();

        }

    }
);

</script>

<!-- ===================== -->
<!-- GAME FILES -->
<!-- ===================== -->

<script src="javascript/assets.js"></script>

<script src="javascript/player.js"></script>

<script src="javascript/enemies.js"></script>

<script src="javascript/world.js"></script>

<script src="javascript/collision.js"></script>

<script src="javascript/ui.js"></script>

<script src="javascript/game.js"></script>

<script>

// Hide loading screen once everything loads

window.addEventListener(
    "load",
    ()=>{

        document
        .getElementById("loading")
        .style.display = "none";

    }
);

</script>

</body>
</html>
